{% extends "base.html" %}

{% block title %}{{ section.title }} — {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ section.title }}</h1>
{% for page in section.pages %}
<article>
  <time>{{ page.date | date(format="%Y-%m-%d") }}</time>
  <a href="{{ page.permalink }}">{{ page.title }}</a>
</article>
{% endfor %}
{% endblock %}
