{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock %}

{% block content %}
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <time>{{ page.date | date(format="%Y-%m-%d") }}</time>
  </header>
  <div class="content">
    {{ page.content | safe }}
  </div>
</article>
{% endblock %}
