{% extends "base.html" %}

{% block content %}
<section class="intro">
  <h1>{{ config.title }}</h1>
  {{ section.content | safe }}
</section>
<section class="posts">
  {% for page in section.pages %}
  <article>
    <time>{{ page.date | date(format="%Y-%m-%d") }}</time>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
  </article>
  {% endfor %}
</section>
{% endblock %}
